name: Build e testes GCM Monitor
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restaurar versões travadas
        shell: pwsh
        run: ./scripts/dev.ps1 Restore
      - name: Compilar Release
        shell: pwsh
        run: ./scripts/dev.ps1 Build -Configuration Release
      - name: Compilar auxiliar passivo revisado (sem instalar driver)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.tools/sensors/lhm-0.9.6' -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.NET.10.zip' -OutFile '.tools/sensors/lhm-0.9.6/LibreHardwareMonitor.NET.10.zip'
          ./scripts/thermal-probe.ps1 -BuildOnly
      - name: Testar contratos e coleta passiva
        shell: pwsh
        run: ./scripts/dev.ps1 Test -Configuration Release
      - name: Verificar publicação self-contained x64
        shell: pwsh
        run: ./scripts/package.ps1 -PublishOnly
      - name: Guardar evidências sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-e-telas-demonstrativas
          path: |
            .artifacts/TestResults/
            .artifacts/ui/
            .artifacts/validation/*.json
          retention-days: 14
